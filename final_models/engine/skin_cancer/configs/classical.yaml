seed: 42
dataset:
  csv: datasets/SKIN_CANCER/archive/hmnist_28_28_RGB.csv
  native_size: 28
  image_size: 64
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
training:
  epochs: 30
  batch_size: 64
  num_workers: 0
  patience: 10
  freeze_backbone_epochs: 2
  weight_decay: 1.0e-4
  label_smoothing: 0.0
  mixed_precision: true
models:
  DermisNova:
    backbone: efficientnet_b0
    dropout: 0.3
    lr: 1.0e-3
    backbone_lr: 1.0e-5
    feature_dim: 1280
  MelanoVanta:
    backbone: efficientnet_b2
    dropout: 0.3
    lr: 8.0e-4
    backbone_lr: 8.0e-6
    feature_dim: 1408
  DermaLumen:
    backbone: convnext_tiny
    dropout: 0.3
    lr: 5.0e-4
    backbone_lr: 5.0e-6
    feature_dim: 768
  DenseNet121:
    backbone: densenet121
    dropout: 0.3
    lr: 5.0e-4
    backbone_lr: 5.0e-6
    feature_dim: 1024
