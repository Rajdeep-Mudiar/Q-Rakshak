seed: 42
dataset:
  csv: datasets/SKIN_CANCER/archive/hmnist_28_28_RGB.csv
  native_size: 28
  image_size: 64
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
training:
  epochs: 100
  batch_size: 64
  num_workers: 0
  patience: 10
  weight_decay: 1.0e-2
  lr: 5.0e-4
  label_smoothing: 0.0
  cosine_T0: 10
  max_grad_norm: 1.0
  mixed_precision: false
  balanced_sampling: false
  scheduler: cosine_restarts
quantum:
  qubits: 10
  layers: 4
  embedding: angle
  ansatz: strongly
  data_reupload: true
  pca_components: 16
  cnn_feature_dim: 128
  dropout: 0.2
  focal_gamma: 2.0
backbone: DenseNet121
